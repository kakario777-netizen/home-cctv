name: release

# version.txt를 올려서 버전이 바뀔 때만 빌드·릴리스한다.
# 외부 풀 리퀘스트로는 실행되지 않는다(pull_request 트리거 없음).
on:
  push:
    branches: [main]
    paths: ['version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'kakario777-netizen/home-cctv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d ' \r\n' < version.txt)"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != '1'
        with:
          gradle-version: '8.7'

      - name: 서명 키 준비
        if: steps.ver.outputs.skip != '1'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "서명 키(KEYSTORE_B64)가 Secrets에 없습니다." | tee build.log
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "서명 키(KEYSTORE_B64) 값이 올바르지 않습니다. (길이: ${#KEYSTORE_B64})" | tee build.log
            exit 1
          fi
          echo "서명 키 크기: $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: 빌드
        if: steps.ver.outputs.skip != '1'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          set -o pipefail
          gradle :app:assembleRelease -PversionName="$VER" --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "home-cctv-$TAG.apk"

      - name: 릴리스 올리기
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          NOTES="$(cat release-notes.md 2>/dev/null || echo "홈 CCTV $TAG")"
          gh release create "$TAG" "home-cctv-$TAG.apk" --target "$GITHUB_SHA" --title "홈 CCTV $TAG" --notes "$NOTES" \
            || gh release upload "$TAG" "home-cctv-$TAG.apk" --clobber

      - name: 실패 로그 저장 (ci-logs 브랜치)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          git init -q
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > build.log 2>/dev/null || echo "로그 없음" > build.log
          echo "$(cat $GITHUB_WORKSPACE/version.txt) $GITHUB_SHA" > ref.txt
          cat > steps.json <<'JSON'
          ${{ toJSON(steps) }}
          JSON
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
