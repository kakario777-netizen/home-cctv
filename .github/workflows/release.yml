name: release

# 태그(v*)를 올릴 때만 빌드한다. 외부 풀 리퀘스트로는 실행되지 않는다(pull_request 트리거 없음).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'kakario777-netizen/home-cctv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "서명 키(KEYSTORE_B64)가 Secrets에 없습니다." | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 빌드
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.0.1" ;; esac
          set -o pipefail
          gradle :app:assembleRelease -PversionName="$VER" --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "home-cctv-$GITHUB_REF_NAME.apk"

      - name: 릴리스 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(cat release-notes.md 2>/dev/null || echo "홈 CCTV $GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "home-cctv-$GITHUB_REF_NAME.apk" --title "홈 CCTV $GITHUB_REF_NAME" --notes "$NOTES" \
            || gh release upload "$GITHUB_REF_NAME" "home-cctv-$GITHUB_REF_NAME.apk" --clobber

      - name: 실패 로그 저장 (ci-logs 브랜치)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          git init -q
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > build.log 2>/dev/null || echo "로그 없음" > build.log
          echo "$GITHUB_REF_NAME $GITHUB_SHA" > ref.txt
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log $GITHUB_REF_NAME"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
